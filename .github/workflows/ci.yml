name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: No org API keys or session tokens in the repository
        run: |
          if git grep -nIE 'cdm_[A-Za-z0-9]{20,}|cps_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "Found something that looks like a credential" >&2
            exit 1
          fi

      - name: Build (debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests (real SDK against the in-app demo transport)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: consenzy-example-debug-apk
          path: app/build/outputs/apk/debug/*.apk
